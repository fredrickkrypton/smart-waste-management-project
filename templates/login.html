<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Eco-Tech Uganda | AI Smart Waste Intelligence</title>
    
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Project CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <!-- Header -->
            <div class="login-card-header">
                <div class="login-logo">
                    <i class="fas fa-leaf"></i>
                </div>
                <h1 class="login-title">ECO-TECH UGANDA</h1>
                <p class="login-subtitle">AI-Powered Waste Intelligence</p>
            </div>

            <!-- Body -->
            <div class="login-card-body">
                <!-- Message Display -->
                <div id="message" class="message-text"></div>

                <!-- Email Input -->
                <div class="form-group">
                    <label class="form-label" for="email">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <input
                        type="email"
                        id="email"
                        class="form-input"
                        placeholder="admin@ecotech.ug"
                        required
                        autocomplete="email"
                    >
                </div>

                <!-- Password Input -->
                <div class="form-group">
                    <label class="form-label" for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <!-- Sign In Button -->
                <button id="submit-btn" class="btn-sign-in" onclick="handleLogin()">
                    <i class="fas fa-arrow-right"></i>
                    <span>Sign In</span>
                </button>
            </div>

            <!-- Footer -->
            <div class="login-footer">
                <p class="login-footer-text">
                    <i class="fas fa-shield-alt"></i>
                    Secure authentication with Firebase
                </p>
            </div>
        </div>
    </div>

    <!-- Project JS -->
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
